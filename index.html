<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#edf1eb" />
    <meta name="description" content="小陈的线上小岛：直接打开 Fend 离线计算器和 Optical Transfer 光学文件传输。" />
    <title>我的小岛 · 小陈的项目集</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="site-shell">
      <header class="topbar">
        <a class="wordmark" href="index.html" aria-label="我的小岛首页">
          <svg class="brand-symbol" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 23c3-2 5 2 8 0s5 2 8 0 5 2 8 0M6 27c3-2 5 2 8 0s5 2 8 0M7 19l7-10 4 6 3-3 5 7H7Z"/><circle cx="24" cy="7" r="2"/></svg>
          <span class="brand-name">我的小岛</span>
        </a>
        <a class="topbar-link" href="https://github.com/TatsuhiroC/chen-site" target="_blank" rel="noopener noreferrer" aria-label="查看本站源码（新窗口打开）">本站源码 <span aria-hidden="true">↗</span></a>
      </header>
      <main class="island-desk" aria-labelledby="home-title">
        <figure class="island-view">
          <img src="assets/scan-islands.jpg" alt="碧绿海水环绕的岛屿，山间与岸边坐落着城堡和小镇" fetchpriority="high" />
          <span class="image-kicker" aria-hidden="true">AN ISLAND OF SMALL THINGS</span>
          <figcaption><span class="image-title">从这里，去做点什么。</span><span class="image-note">一座小岛，两个通往想法的入口。</span></figcaption>
        </figure>
        <div class="desk-content">
          <div class="intro">
            <p class="eyebrow">A SMALL CORNER BY CHEN</p>
            <h1 id="home-title">我的<em>小岛。</em></h1>
            <p class="intro-description">两个小工具，都从这里出发。</p>
          </div>
          <section aria-labelledby="projects-title">
            <div class="projects-heading"><h2 id="projects-title">我的项目 / 02</h2></div>
            <div id="tool-grid" class="tool-grid">
              <article class="tool-card tool-card--fend">
                <div class="tool-heading">
                  <div class="tool-icon"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="9" y="5.5" width="30" height="37" rx="5"/><path d="M16 14h16M16 22h4m8 0h4M16 30h4m8 0h4M16 36h16"/></svg></div>
                  <div><h3>离线计算器</h3><span class="tool-name" lang="en">Fend Offline</span></div>
                </div>
                <p class="tool-description">计算与单位换算，离线也能使用。</p>
                <div class="card-footer">
                  <a class="source-link" href="https://github.com/TatsuhiroC/fend-offline" target="_blank" rel="noopener noreferrer" aria-label="查看 Fend Offline 源码（新窗口打开）">项目源码 <span aria-hidden="true">↗</span></a>
                  <a class="launch-link" href="https://tatsuhiroc.github.io/fend-offline/" target="_blank" rel="noopener noreferrer" aria-label="打开 Fend 离线计算器（新窗口打开）">打开工具 <span aria-hidden="true">↗</span></a>
                </div>
              </article>
              <article class="tool-card tool-card--transfer">
                <div class="tool-heading">
                  <div class="tool-icon"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="8" y="8" width="12" height="12"/><rect x="28" y="8" width="12" height="12"/><rect x="8" y="28" width="12" height="12"/><path d="M28 28h4m4 0h4m-12 4v8m4-4h8"/></svg></div>
                  <div><h3>光学文件传输</h3><span class="tool-name" lang="en">Optical Transfer</span></div>
                </div>
                <p class="tool-description">通过动态二维码，在两台设备间离线传文件。</p>
                <div class="card-footer">
                  <a class="source-link" href="https://github.com/TatsuhiroC/optical-transfer-pwa" target="_blank" rel="noopener noreferrer" aria-label="查看 Optical Transfer 源码（新窗口打开）">项目源码 <span aria-hidden="true">↗</span></a>
                  <a class="launch-link" href="https://tatsuhiroc.github.io/optical-transfer-pwa/" target="_blank" rel="noopener noreferrer" aria-label="打开 Optical Transfer 光学文件传输（新窗口打开）">打开工具 <span aria-hidden="true">↗</span></a>
                </div>
              </article>
            </div>
          </section>
        </div>
      </main>
      <footer class="site-footer"><span class="footer-signature">MADE BY CHEN</span><span>小工具，让想法靠岸。</span></footer>
    </div>
  </body>
</html>
